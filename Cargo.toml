[package]
name = "PEnginePs1"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "PEnginePs1"
path = "src/main.rs"

[dependencies]
minifb = "0.26"
ureq = "2.9"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
